name: Update popular songs

on:
  schedule:
    # 日本時間 毎日12:30
    # GitHub ActionsはUTCなので03:30
    - cron: '30 3 * * *'

  workflow_dispatch:

permissions:
  contents: write


jobs:

  update-ranking:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Update popular songs
        run: npm run update:popular


      - name: Commit changes
        run: |

          git config user.name "kimikey-bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add public/popular-songs.json

          if git diff --cached --quiet; then

            echo "ランキング変更なし"

            exit 0

          fi

          git commit \
            -m "Update karaoke ranking"

          git push