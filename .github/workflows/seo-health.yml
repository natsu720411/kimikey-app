name: Weekly SEO and app integrity

on:
  schedule:
    # 月曜日08:17 JST = 日曜日23:17 UTC
    - cron: '17 23 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/google_free_seo_audit.py'
      - 'scripts/seo-safe-autofix.mjs'
      - 'scripts/seo-safe-fixes.js'
      - 'scripts/tests/**'
      - '.github/workflows/seo-health.yml'
permissions:
  contents: read
concurrency:
  group: kimikey-free-seo-audit
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Google SEO logic
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Test safe SEO auto-fixes
        run: node --test scripts/tests/seo-safe-autofix.test.mjs
      - run: npm ci
      - name: Generate and inspect site
        run: npm run build
      - name: Check Google authentication
        id: google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '## Google公式APIの認証設定待ち' >> "$GITHUB_STEP_SUMMARY"
            echo 'GOOGLE_SERVICE_ACCOUNT_JSON が未設定です。サイトのSEO点検は完了しましたがGoogle実データは未取得です。' >> "$GITHUB_STEP_SUMMARY"
            echo '設定ガイド：docs/GOOGLE_FREE_ANALYTICS_SETUP.md' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Google authentication
        if: steps.google.outputs.configured == 'true'
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2.31,<3'
      - name: Search Console and GA4 weekly analysis
        if: steps.google.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GSC_SITE_URL: https://kimikey-app.vercel.app/
          REPORT_PATH: reports/google-seo-weekly.md
        run: python scripts/google_free_seo_audit.py
      - name: Save SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimikey-weekly-seo
          path: |
            reports/seo-audit.json
            reports/seo-opportunities.md
            reports/seo-auto-fix.json
            reports/google-seo-weekly.md
          retention-days: 14
          if-no-files-found: warn
