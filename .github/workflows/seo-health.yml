name: Weekly SEO and app integrity

on:
  schedule:
    # 月曜日 10:15（日本時間）= UTC月曜日01:15
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate generated SEO pages, catalog, range and UI
        run: npm run build
      - name: Preserve SEO audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimikey-weekly-seo
          path: |
            reports/seo-audit.json
            reports/seo-opportunities.md
          if-no-files-found: warn
